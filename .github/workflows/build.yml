name: Build Bundy Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

jobs:
  build-mac:
    runs-on: macos-14  # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Publish (DMG + ZIP + latest-mac.yml → GitHub Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package DMG (non-tag builds only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx electron-builder --mac --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bundy-mac-dmg
          path: dist/*.dmg
          retention-days: 30
