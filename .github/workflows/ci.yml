name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips electron-builder install-app-deps
        # (which downloads electron and rebuilds native modules — we
        # don't need those for lint/typecheck/renderer tests).
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck (renderer)
        # The renderer tsconfig is the broadest; main + preload are subsets.
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Test
        run: npm run test
